<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Luyện tiếng Việt</title>
<style>
  :root {
    --bg: #f6f5f3;
    --surface: #ffffff;
    --text: #1c1b19;
    --muted: #6b6862;
    --border: #e2dfd9;
    --accent: #c8452f;
    --accent-text: #ffffff;
    --bot-bubble: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917;
      --surface: #242220;
      --text: #f0eeea;
      --muted: #9a958c;
      --border: #38352f;
      --accent: #e0674f;
      --accent-text: #1a1917;
      --bot-bubble: #242220;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overscroll-behavior: none;
  }

  header {
    flex: none;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; flex: 1; }
  #turns { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #reset {
    font: inherit; font-size: 14px;
    background: none; border: 1px solid var(--border);
    color: var(--muted); border-radius: 999px;
    padding: 6px 14px; cursor: pointer;
  }
  #reset:active { background: var(--border); }

  #log {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 82%; padding: 11px 15px; border-radius: 20px; white-space: pre-wrap; word-wrap: break-word; }
  .them { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 6px; align-self: flex-start; }
  .me { background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 6px; align-self: flex-end; }
  .note { align-self: center; font-size: 14px; color: var(--muted); text-align: center; max-width: 90%; }
  .typing { color: var(--muted); font-style: italic; }

  form {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    font: inherit;
    font-size: 17px; /* >=16px keeps iOS from zooming on focus */
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--bg);
    color: var(--text);
    min-width: 0;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send {
    flex: none;
    font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
    border: none; border-radius: 22px;
    padding: 12px 22px; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
  <header>
    <h1>Luyện tiếng Việt</h1>
    <span id="turns"></span>
    <button id="reset" type="button">Chủ đề mới</button>
  </header>

  <div id="log">
    <div class="note">Nhắn “Xin chào” để bắt đầu.<br>Say hello to start a conversation.</div>
  </div>

  <form id="form">
    <input id="input" autocomplete="off" autocapitalize="sentences"
           placeholder="Viết bằng tiếng Việt…" enterkeyhint="send">
    <button id="send" type="submit">Gửi</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const turns = document.getElementById('turns');

let sessionId = localStorage.getItem('vp_session') || null;

function add(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function note(text) {
  const el = document.createElement('div');
  el.className = 'note';
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  add(text, 'me');
  input.value = '';
  send.disabled = true;

  const pending = add('…', 'them typing');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    sessionId = data.session_id;
    localStorage.setItem('vp_session', sessionId);

    pending.textContent = data.reply;
    pending.classList.remove('typing');
    turns.textContent = data.turn_count + '/' + data.max_turns;

    if (data.topic_complete) {
      note('Hết chủ đề này — nhấn “Chủ đề mới” để bắt đầu lại.');
    }
  } catch (err) {
    pending.textContent = 'Lỗi kết nối: ' + err.message;
    pending.classList.remove('typing');
  } finally {
    send.disabled = false;
    input.focus();
  }
});

document.getElementById('reset').addEventListener('click', async () => {
  await fetch('/session/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: '', session_id: sessionId })
  });
  log.innerHTML = '';
  turns.textContent = '';
  note('Chủ đề mới. Nhắn “Xin chào” để bắt đầu.');
});
</script>
</body>
</html>
