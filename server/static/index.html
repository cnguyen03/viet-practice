<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Luyện tiếng Việt</title>
<style>
  :root {
    --bg: #f6f5f3;
    --surface: #ffffff;
    --text: #1c1b19;
    --muted: #6b6862;
    --border: #e2dfd9;
    --accent: #c8452f;
    --accent-text: #ffffff;
    --bot-bubble: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917;
      --surface: #242220;
      --text: #f0eeea;
      --muted: #9a958c;
      --border: #38352f;
      --accent: #e0674f;
      --accent-text: #1a1917;
      --bot-bubble: #242220;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overscroll-behavior: none;
  }

  header {
    flex: none;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; flex: 1; }
  #turns { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #reset {
    font: inherit; font-size: 14px;
    background: none; border: 1px solid var(--border);
    color: var(--muted); border-radius: 999px;
    padding: 6px 14px; cursor: pointer;
  }
  #reset:active { background: var(--border); }

  #log {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 82%; padding: 11px 15px; border-radius: 20px; white-space: pre-wrap; word-wrap: break-word; }
  .them { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 6px; align-self: flex-start; }
  .me { background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 6px; align-self: flex-end; }
  .note { align-self: center; font-size: 14px; color: var(--muted); text-align: center; max-width: 90%; }
  .typing { color: var(--muted); font-style: italic; }
  .heard { font-size: 12px; opacity: .75; display: block; margin-top: 4px; font-style: italic; }
  .speakable { cursor: pointer; }
  .speakable:active { opacity: .7; }

  #mic {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; /* stop the press-and-hold gesture from scrolling */
    user-select: none; -webkit-user-select: none;
  }
  #mic.recording { background: var(--accent); color: var(--accent-text); border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  #mic:disabled { opacity: .4; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { #mic.recording { animation: none; } }

  form {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    font: inherit;
    font-size: 17px; /* >=16px keeps iOS from zooming on focus */
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--bg);
    color: var(--text);
    min-width: 0;
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send {
    flex: none;
    font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
    border: none; border-radius: 22px;
    padding: 12px 22px; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
  <header>
    <h1>Luyện tiếng Việt</h1>
    <span id="turns"></span>
    <button id="reset" type="button">Chủ đề mới</button>
  </header>

  <div id="log">
    <div class="note">Nhắn “Xin chào” để bắt đầu.<br>Say hello to start a conversation.</div>
  </div>

  <form id="form">
    <button id="mic" type="button" title="Giữ để nói" aria-label="Giữ để nói">🎤</button>
    <input id="input" autocomplete="off" autocapitalize="sentences"
           placeholder="Giữ 🎤 để nói…" enterkeyhint="send">
    <button id="send" type="submit">Gửi</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const turns = document.getElementById('turns');

let sessionId = localStorage.getItem('vp_session') || null;

/* ---- speech playback ----
   Mobile browsers only allow audio from a user gesture. We keep ONE Audio
   element and "unlock" it on the first tap, so later replies (which arrive
   asynchronously, long after the gesture) are still allowed to play. */
const player = new Audio();
let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  // A silent 1-sample wav: playing it inside the gesture blesses the element.
  player.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  player.play().catch(() => {});
}
document.addEventListener('pointerdown', unlockAudio, { once: true });

async function speak(text) {
  if (!text) return;
  try {
    const res = await fetch('/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!res.ok) return;
    const url = URL.createObjectURL(await res.blob());
    player.src = url;
    player.onended = () => URL.revokeObjectURL(url);
    await player.play();
  } catch (err) {
    /* playback is a nicety — never break the conversation over it */
  }
}

function add(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function note(text) {
  const el = document.createElement('div');
  el.className = 'note';
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function applyReply(pending, data, myBubble) {
  sessionId = data.session_id;
  localStorage.setItem('vp_session', sessionId);

  // Show what the recogniser actually heard, so a misheard word is visible
  // rather than silently steering the conversation.
  if (myBubble && data.transcript) {
    myBubble.textContent = data.transcript;
  }

  pending.textContent = data.reply;
  pending.classList.remove('typing');
  pending.classList.add('speakable');
  pending.title = 'Nhấn để nghe lại';
  pending.onclick = () => speak(data.reply);   // tap a line to hear it again
  turns.textContent = data.turn_count + '/' + data.max_turns;

  speak(data.reply);

  if (data.topic_complete) {
    note('Hết chủ đề này — nhấn “Chủ đề mới” để bắt đầu lại.');
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  add(text, 'me');
  input.value = '';
  send.disabled = true;

  const pending = add('…', 'them typing');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    applyReply(pending, await res.json(), null);
  } catch (err) {
    pending.textContent = 'Lỗi kết nối: ' + err.message;
    pending.classList.remove('typing');
  } finally {
    send.disabled = false;
    input.focus();
  }
});

/* ---- hold-to-talk ---- */
const mic = document.getElementById('mic');
let recorder = null, chunks = [], stream = null;

function pickMimeType() {
  // Chrome gives webm/opus, Safari gives mp4/aac. Both decode server-side.
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

async function startRecording() {
  if (recorder) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    note('Trình duyệt chặn micro vì trang không dùng HTTPS. '
       + 'Mic is blocked because this page is not served over HTTPS — '
       + 'run ./scripts/make_cert.sh on the laptop.');
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    note('Không dùng được micro: ' + err.name);
    return;
  }

  const mimeType = pickMimeType();
  recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.start();
  mic.classList.add('recording');
}

async function stopRecording() {
  if (!recorder) return;
  const rec = recorder;
  recorder = null;
  mic.classList.remove('recording');

  const finished = new Promise((resolve) => { rec.onstop = resolve; });
  rec.stop();
  await finished;
  stream.getTracks().forEach((t) => t.stop());

  const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
  if (blob.size < 1200) {           // a tap rather than a held press
    note('Giữ nút lâu hơn một chút nhé.');
    return;
  }

  const myBubble = add('🎤 …', 'me');
  const pending = add('…', 'them typing');
  mic.disabled = send.disabled = true;

  try {
    const fd = new FormData();
    fd.append('audio', blob, 'turn.webm');
    if (sessionId) fd.append('session_id', sessionId);

    const res = await fetch('/voice', { method: 'POST', body: fd });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data.transcript) myBubble.textContent = '🎤 (không nghe rõ)';
    applyReply(pending, data, myBubble);
  } catch (err) {
    pending.textContent = 'Lỗi kết nối: ' + err.message;
    pending.classList.remove('typing');
  } finally {
    mic.disabled = send.disabled = false;
  }
}

mic.addEventListener('pointerdown', (e) => { e.preventDefault(); startRecording(); });
mic.addEventListener('pointerup', (e) => { e.preventDefault(); stopRecording(); });
mic.addEventListener('pointercancel', () => stopRecording());
mic.addEventListener('pointerleave', () => { if (recorder) stopRecording(); });
mic.addEventListener('contextmenu', (e) => e.preventDefault());

document.getElementById('reset').addEventListener('click', async () => {
  await fetch('/session/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: '', session_id: sessionId })
  });
  log.innerHTML = '';
  turns.textContent = '';
  note('Chủ đề mới. Nhắn “Xin chào” để bắt đầu.');
});
</script>
</body>
</html>
